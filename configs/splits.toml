# Inter-patient record split (de Chazal et al. 2004), fixed 29 Sep 2026.
# Any change here after the freeze tag invalidates the DS2 run.

[ds1]
train = [101, 106, 108, 109, 112, 115, 116, 118, 119, 122, 201, 203, 205, 208, 223, 230]
cal   = [114, 124, 207, 209, 215, 220]

