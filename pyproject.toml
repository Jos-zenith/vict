[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vgate"
version = "0.1.0"
description = "Signal-quality gating vs a conservative threshold for V-beat detection under held-out NSTDB noise"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "wfdb>=4.1",
    "PyWavelets>=1.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vgate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs MIT-BIH / NSTDB downloaded into data/raw"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
